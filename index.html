<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast5</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-top-left">
        <div class="label">LAP</div>
        <div id="lap" class="value">1/3</div>
      </div>
      <div class="hud-top-right">
        <div class="label">TIME</div>
        <div id="time" class="value">0:00.000</div>
        <div class="label">BEST LAP</div>
        <div id="best" class="value small">--</div>
      </div>
      <div class="hud-bottom-right">
        <div id="speed" class="speed">0</div>
        <div class="label">KM/H</div>
      </div>
      <canvas id="minimap" width="180" height="180"></canvas>
      <div id="wrong-way" class="hidden">WRONG WAY</div>
    </div>

    <div id="center-message" class="hidden"></div>

    <div id="overlay">
      <h1>FAST5</h1>
      <p id="overlay-sub">3 laps. Set the fastest time.</p>
      <p class="controls">
        <b>W / ↑</b> accelerate &nbsp; <b>S / ↓</b> brake / reverse &nbsp; <b>A D / ← →</b> steer<br />
        <b>Space</b> handbrake &nbsp; <b>R</b> reset to track &nbsp; <b>C</b> change camera
      </p>
      <p class="start">Press <b>Enter</b> to start</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
